name: Deploy Laravel (cPanel SSH)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 🐘 Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: 📦 Install & build frontend assets
        run: |
          npm install
          npm run build

      - name: �📤 Upload files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 20m
          source: .,!.git,!.github,!.gitignore,!.env,!.docker-compose.yml,!.Dockerfile,!.README.md,!.log,!.zip,!node_modules,!public/models
          target: 'public_html/subdomains/cidsa'
          rm: false

      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd public_html/subdomains/cidsa
            PHP=/opt/cpanel/ea-php82/root/usr/bin/php

            echo "📝 Create .env file"
            cat <<EOF > .env
            APP_NAME=${{ secrets.APP_NAME }}
            APP_ENV=${{ secrets.APP_ENV }}
            APP_KEY=${{ secrets.APP_KEY }}
            APP_DEBUG=${{ secrets.APP_DEBUG }}
            APP_URL=${{ secrets.APP_URL }}

            APP_LOCALE=${{ secrets.APP_LOCALE }}
            APP_FALLBACK_LOCALE=${{ secrets.APP_FALLBACK_LOCALE }}
            APP_FAKER_LOCALE=${{ secrets.APP_FAKER_LOCALE }}

            APP_MAINTENANCE_DRIVER=${{ secrets.APP_MAINTENANCE_DRIVER }}
            APP_API_BASE_URL=${{ secrets.APP_API_BASE_URL }}

            BCRYPT_ROUNDS=${{ secrets.BCRYPT_ROUNDS }}

            LOG_CHANNEL=${{ secrets.LOG_CHANNEL }}
            LOG_STACK=${{ secrets.LOG_STACK }}
            LOG_DEPRECATIONS_CHANNEL=${{ secrets.LOG_DEPRECATIONS_CHANNEL }}
            LOG_LEVEL=${{ secrets.LOG_LEVEL }}

            DB_CONNECTION=${{ secrets.DB_CONNECTION }} 
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_DATABASE=${{ secrets.DB_DATABASE }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}

            TAL_DB_HOST=${{ secrets.TAL_DB_HOST }}
            TAL_DB_PORT=${{ secrets.TAL_DB_PORT }}
            TAL_DB_DATABASE=${{ secrets.TAL_DB_DATABASE }}
            TAL_DB_USERNAME=${{ secrets.TAL_DB_USERNAME }}
            TAL_DB_PASSWORD=${{ secrets.TAL_DB_PASSWORD }}

            ALI_DB_HOST=${{ secrets.ALI_DB_HOST }}
            ALI_DB_PORT=${{ secrets.ALI_DB_PORT }}
            ALI_DB_DATABASE=${{ secrets.ALI_DB_DATABASE }}
            ALI_DB_USERNAME=${{ secrets.ALI_DB_USERNAME }}
            ALI_DB_PASSWORD=${{ secrets.ALI_DB_PASSWORD }}

            FT_DB_HOST=${{ secrets.FT_DB_HOST }}
            FT_DB_PORT=${{ secrets.FT_DB_PORT }}
            FT_DB_DATABASE=${{ secrets.FT_DB_DATABASE }}
            FT_DB_USERNAME=${{ secrets.FT_DB_USERNAME }}
            FT_DB_PASSWORD=${{ secrets.FT_DB_PASSWORD }}

            BIN_DB_HOST=${{ secrets.BIN_DB_HOST }}
            BIN_DB_PORT=${{ secrets.BIN_DB_PORT }}
            BIN_DB_DATABASE=${{ secrets.BIN_DB_DATABASE }}
            BIN_DB_USERNAME=${{ secrets.BIN_DB_USERNAME }}
            BIN_DB_PASSWORD=${{ secrets.BIN_DB_PASSWORD }}

            SESSION_DRIVER=${{ secrets.SESSION_DRIVER }}
            SESSION_LIFETIME=${{ secrets.SESSION_LIFETIME }}
            SESSION_ENCRYPT=${{ secrets.SESSION_ENCRYPT }}
            SESSION_PATH=${{ secrets.SESSION_PATH }}
            SESSION_SECURE_COOKIE=${{ secrets.SESSION_SECURE_COOKIE }}
            SESSION_SAME_SITE=${{ secrets.SESSION_SAME_SITE }}

            BROADCAST_CONNECTION=${{ secrets.BROADCAST_CONNECTION }}
            FILESYSTEM_DISK=${{ secrets.FILESYSTEM_DISK }}
            QUEUE_CONNECTION=${{ secrets.QUEUE_CONNECTION }}

            CACHE_STORE=${{ secrets.CACHE_STORE }}

            MEMCACHED_HOST=${{ secrets.MEMCACHED_HOST }}

            VITE_APP_NAME=${{ secrets.VITE_APP_NAME }}

            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }}
            GOOGLE_DRIVE_FOLDER_ID=${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
            GOOGLE_APPLICATION_CREDENTIALS=${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
            EOF

            echo "📦 Composer install"
            # vendor/ is uploaded via SCP; just dump the autoloader
            composer dump-autoload --no-dev --optimize 2>/dev/null || true

            echo "🔗 Storage link"
            $PHP artisan storage:link || true

            echo "⚙️ Laravel setup"
            $PHP artisan migrate --force

            echo "🧹 Optimize"
            $PHP artisan optimize:clear
            $PHP artisan config:cache

            echo "✅ Deployment completed!"
